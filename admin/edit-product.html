<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>Edit Product</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/admin-responsive.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div id="sidebarContent"></div>
        </aside>

        <main class="admin-content">
            <header class="admin-header">
                <div>
                    <p class="eyebrow">Store management</p>
                    <h1>Edit Product</h1>
                </div>
                <a href="products.html" class="btn btn-secondary">Back to products</a>
            </header>

            <form id="editProductForm" class="admin-form">
                <fieldset>
                    <legend>Product Information</legend>
                    <div class="admin-form-grid">
                        <div class="admin-field">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required />
                        </div>
                        <div class="admin-field">
                            <label for="category_id">Category</label>
                            <select id="category_id" name="category_id" required></select>
                        </div>
                        <div class="admin-field">
                            <label for="price">Price</label>
                            <input type="number" id="price" name="price" step="0.01" required />
                        </div>
                        <div class="admin-field">
                            <label for="stock">Stock</label>
                            <input type="number" id="stock" name="stock" required />
                        </div>
                        <div class="admin-field">
                            <label for="discount_percent">Discount (%)</label>
                            <input type="number" id="discount_percent" name="discount_percent" min="0" max="100" value="0" />
                        </div>
                        <div class="admin-field admin-field-wide">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="5"></textarea>
                        </div>
                        <div class="admin-field admin-field-wide">
                            <label for="imageFile">Replace image</label>
                            <input type="file" id="imageFile" name="image" accept="image/jpeg,image/png,image/webp" />
                            <small class="field-help">Leave empty to keep the current image.</small>
                            <div id="imagePreview" class="upload-preview"></div>
                        </div>
                    </div>
                </fieldset>

                <div class="admin-form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="products.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </div>

    <script src="assets/js/admin.js"></script>
    <script src="assets/js/products.js"></script>
</body>
</html>
