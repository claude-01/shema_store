<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/admin-responsive.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div id="sidebarContent"></div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <!-- Header -->
            <header class="admin-header">
                <h1>Products</h1>
                <a href="add-product.html" class="btn btn-primary">Add New Product</a>
            </header>

            <!-- Products List -->
            <section class="products-table">
                <!-- Table populated by admin/assets/js/products.js -->
                <div class="admin-note">Loading products... If none display, please check your API or open the Add New Product form.</div>
            </section>
        </main>
    </div>

    <script src="assets/js/admin.js"></script>
    <script src="assets/js/products.js"></script>
</body>
</html>
