<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <!-- To be implemented -->
    </nav>

    <!-- Products Section -->
    <section class="products-section">
        <div class="container">
            <aside class="sidebar">
                <!-- Product filters are rendered here. -->
            </aside>

            <main class="products-results">
                <div class="products-results-heading">
                    <div>
                        <nav class="products-breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span>›</span><strong>All products</strong></nav>
                        <h1>Shop all products</h1>
                        <p id="productsSummary">Browse our latest products and everyday essentials.</p>
                    </div>
                    <label class="products-sort">Sort by
                        <select id="productsSort" aria-label="Sort products">
                            <option value="featured">Featured</option>
                            <option value="price-low">Price: low to high</option>
                            <option value="price-high">Price: high to low</option>
                            <option value="name">Name</option>
                        </select>
                    </label>
                </div>
                <div class="products-grid">
                    <!-- Product cards will be loaded here -->
                </div>
            </main>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <!-- To be implemented -->
    </footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
