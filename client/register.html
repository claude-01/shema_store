<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <!-- To be implemented -->
    </nav>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="auth-container">
            <form id="registerForm" class="register-form">
                <h2>Customer Registration</h2>
                <label for="firstName">First name</label><input id="firstName" name="firstName" required>
                <label for="lastName">Last name</label><input id="lastName" name="lastName" required>
                <label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" required>
                <label for="registerPhone">Phone</label><input id="registerPhone" name="phone" type="tel">
                <label for="registerPassword">Password</label><input id="registerPassword" name="password" type="password" minlength="6" required>
                <label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required>
                <button type="submit">Register</button>
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <!-- To be implemented -->
    </footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
